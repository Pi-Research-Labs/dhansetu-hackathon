name: Deploy Website to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for Workload Identity Federation
  contents: read

jobs:
  deploy:
    name: Build and Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      # No service account key involved anywhere in this workflow — the org
      # blocks creating them (constraints/iam.managed.disableServiceAccountKeyCreation).
      # This exchanges GitHub's own OIDC token for short-lived GCP credentials
      # instead, scoped to this exact repo (see the provider's attribute-condition).
      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WEB_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        working-directory: web
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project=dhansetu-19e56 --non-interactive
