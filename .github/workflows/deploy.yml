name: Deploy Backend to GCP VM

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GCP Compute Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: SSH and Deploy to GCP VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Navigating to repository on GCP VM..."
            # Finds repository folder in common home or app directories
            if [ -d "$HOME/dhansetu-hackathon" ]; then
              cd "$HOME/dhansetu-hackathon"
            elif [ -d "/var/www/dhansetu-hackathon" ]; then
              cd "/var/www/dhansetu-hackathon"
            else
              echo "Error: Repository folder not found on VM!"
              exit 1
            fi

            echo "📥 Fetching latest changes from git..."
            git fetch --all
            git reset --hard origin/$(git rev-parse --abbrev-ref HEAD)

            echo "🐍 Setting up Python environment..."
            cd backend
            if [ -d "venv" ]; then
              source venv/bin/activate
            elif [ -d ".venv" ]; then
              source .venv/bin/activate
            else
              python3 -m venv venv
              source venv/bin/activate
            fi

            echo "📦 Installing backend requirements..."
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "🔄 Restarting FastAPI service..."
            if systemctl is-active --quiet dhansetu-backend; then
              sudo systemctl restart dhansetu-backend
              echo "✅ systemd service 'dhansetu-backend' restarted."
            elif command -v pm2 >/dev/null 2>&1 && pm2 list | grep -q "dhansetu-backend"; then
              pm2 restart dhansetu-backend
              echo "✅ PM2 process 'dhansetu-backend' restarted."
            else
              echo "⚡ Reloading FastAPI process..."
              pkill -f "fastapi" || pkill -f "uvicorn" || true
              nohup python3 -m fastapi run app/main.py --host 0.0.0.0 --port 8000 > app.log 2>&1 &
              echo "✅ Backend restarted in background with nohup."
            fi

            echo "🎉 Deployment successful!"
